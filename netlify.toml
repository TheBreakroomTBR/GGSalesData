[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Pulls yesterday's (and the day before's) TikTok sales every morning
# 11:00 UTC = 6am Eastern in winter, 7am in summer
[functions."daily-sync"]
  schedule = "0 11 * * *"

# Claude connector: https://YOUR-SITE.netlify.app/mcp/<MCP_KEY>
[[redirects]]
  from = "/mcp/*"
  to = "/.netlify/functions/mcp/:splat"
  status = 200
  force = true

# EchoTik through the same key: https://YOUR-SITE.netlify.app/echotik/<MCP_KEY>
[[redirects]]
  from = "/echotik/*"
  to = "/.netlify/functions/echotik/:splat"
  status = 200
  force = true

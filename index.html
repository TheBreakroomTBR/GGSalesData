<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Helmet Live Daily P/L</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Saira:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#130c28;--panel:#1c1240;--panel2:#251854;--brand:#2d1b69;--line:#3b2b7a;--gold:#c9b800;--text:#f2edfb;--muted:#a99fcb;--loss:#ff7a6b;--cond:'Saira Condensed','Arial Narrow',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Saira',system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
h1{font-family:var(--cond);font-weight:800;font-size:30px;line-height:1;margin:0}
.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:999px}
nav button{border:0;background:none;padding:7px 16px;border-radius:999px;cursor:pointer;font-family:var(--cond);font-weight:600;font-size:16px;color:var(--muted)}
nav button[aria-selected=true]{background:var(--brand);color:var(--text)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--muted);font-size:13px}
.chips button.on{border-color:var(--gold);color:var(--gold)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1033;font-weight:600}
.btn.danger{border-color:var(--loss);color:var(--loss);background:none}
.btn:disabled{opacity:.5;cursor:default}
input[type=date],input[type=number],input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;color:var(--text)}
.board{display:grid;grid-template-columns:1fr 1.3fr 1fr;background:#0c0720;border:2px solid var(--line);border-radius:16px;overflow:hidden}
.board>div{padding:18px 20px;text-align:center}
.board>div+div{border-left:2px solid var(--line)}
.board .lbl{font-family:var(--cond);font-weight:600;font-size:17px;color:var(--muted)}
.board .num{font-family:var(--cond);font-weight:800;font-size:clamp(34px,6.2vw,76px);line-height:1.02;font-variant-numeric:tabular-nums}
.board .net{background:var(--brand)}
.board .net .num{color:var(--gold)}
.board .net .num.neg{color:var(--loss)}
.board .foot{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
.stats>div{background:var(--panel);padding:12px 14px}
.stats .k{font-size:13px;color:var(--muted)}
.stats .v{font-family:var(--cond);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
section h2{font-family:var(--cond);font-weight:700;font-size:22px;margin:0 0 2px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:'Saira'}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:13px;position:sticky;top:0;background:var(--panel)}
th:first-child,td:first-child{text-align:left}
.pos{color:var(--gold)}.neg{color:var(--loss)}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.row label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 16px 4px 0}
.banner{background:var(--panel2);border-left:3px solid var(--gold);padding:10px 14px;border-radius:6px;margin-top:12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--gold);color:#1a1033;padding:10px 18px;border-radius:14px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw}
.toast.show{opacity:1}.toast.err{background:var(--loss)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
@media (max-width:760px){.board{grid-template-columns:1fr 1fr}.board .net{grid-column:1/-1;order:-1;border-bottom:2px solid var(--line)}.board>div+div{border-left:0}.board>div:last-child{border-left:2px solid var(--line)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2>section{margin-top:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form .wide{grid-column:span 2}
.form input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--text);min-width:0}
tr.editing{background:var(--panel2)}
tbody tr[data-id]:hover{background:var(--panel2)}
.who{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
@media (max-width:760px){.grid2{grid-template-columns:1fr}.form .wide{grid-column:auto}}
.board.four{grid-template-columns:1fr 1.3fr 1fr 1fr}
table.entry input{width:100%;min-width:70px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--text);text-align:right}
table.entry td{padding:6px}
table.entry tfoot td{color:var(--muted);font-weight:600;border-bottom:0}
.list{display:flex;flex-direction:column;gap:8px}
.mini{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px;font-size:15px}
.mini:hover{color:var(--loss)}
@media (max-width:760px){.board.four{grid-template-columns:1fr 1fr}.board.four .net{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Helmet Live</h1><div class="sub">Daily profit &amp; loss</div></div>
    <nav role="tablist"><button data-tab="days" aria-selected="true">Dashboard</button><button data-tab="log" aria-selected="false">Log a day</button><button data-tab="setup" aria-selected="false">Setup</button></nav>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const API = '/.netlify/functions', KEYK = 'pl_admin_key';
const DEFAULT_CONFIG = {
  feePct: 8,
  breakers: ['Sam', 'Kris'],
  products: [
    { name: 'Gridiron Grail', field: 'Gridiron Grail Boxes', cost: 400 },
    { name: 'Pup Lids', field: 'Pup Lids Boxes', cost: 450 }
  ]
};
const DAY_NON_COST = ['Date', 'Sales', 'Orders', 'Breaks', 'Helmets', 'Profit', 'Margin', 'Fees', 'id'];
const COLORS = ['#c9b800', '#9b7bff', '#5fd1c1', '#ff9f6b', '#e57bd8', '#7bb6ff'];
const S = { days: [], breaks: [], baseId: '', cfg: JSON.parse(JSON.stringify(DEFAULT_CONFIG)), tab: 'days', range: 'week', from: '', to: '',
  metric: 'profit', group: localStorage.getItem('pl_group') || 'day', tiktok: null, entryDate: null,
  notCost: JSON.parse(localStorage.getItem('pl_not_cost') || '[]') };

const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const money = (n, short) => (n < 0 ? '−' : '') + '$' + Math.abs(n || 0).toLocaleString(undefined, { minimumFractionDigits: short ? 0 : 2, maximumFractionDigits: short ? 0 : 2 });
const pct = n => (isFinite(n) ? (n * 100).toFixed(1) : '0.0') + '%';
const num = v => typeof v === 'number' ? v : 0;
const fmtN = n => (Math.round(n * 10) / 10).toLocaleString();
const dayLabel = (k, dow) => new Date(k + 'T12:00:00').toLocaleDateString(undefined, dow ? { weekday: 'short', month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric' });
const shift = (k, n) => { const d = new Date(k + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const todayK = () => ymd(new Date());
const weekStart = k => { const d = new Date(k + 'T12:00:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };
const daysBetween = (a, b) => Math.round((Date.parse(b + 'T12:00:00') - Date.parse(a + 'T12:00:00')) / 86400000) + 1;
function toast(m, err){ const t = $('#toast'); t.textContent = m; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', err ? 12000 : 2600); }

async function req(fn, opts = {}){
  const r = await fetch(`${API}/${fn}`, { ...opts, headers: { 'Content-Type': 'application/json', 'x-admin-key': localStorage.getItem(KEYK) || '' } });
  const text = await r.text(); let d;
  try { d = text ? JSON.parse(text) : {}; } catch { throw new Error(`${fn.split('?')[0]} returned ${r.status}: ${text.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140)}`); }
  if (r.status === 401){ const k = prompt('Enter your admin key (ADMIN_KEY from Netlify):'); if (k){ localStorage.setItem(KEYK, k.trim()); return req(fn, opts); } throw new Error('Admin key needed'); }
  if (!r.ok) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}
async function guarded(fn){ try { await fn(); } catch (e){ console.error(e); toast(e.message, true); } }

/* ---------- Costs ---------- */
const prodFields = () => S.cfg.products.map(p => p.field);
const breakNonCost = () => ['Date', 'Breaker', 'Helmets', 'Sales', 'Notes', 'Box Cost', 'id', ...prodFields()];
function numCols(list, skip){ const seen = []; list.forEach(r => Object.entries(r).forEach(([k, v]) => { if (typeof v === 'number' && !skip.includes(k) && !seen.includes(k)) seen.push(k); })); return seen; }
const dayCostCols = () => numCols(S.days, DAY_NON_COST).filter(c => !S.notCost.includes(c));
const breakExtraCols = () => numCols(S.breaks, breakNonCost()).filter(x => !S.notCost.includes(x));
// Fees: the day's own Fees number if you set one, otherwise the default % of that day's sales
const feePct = () => Number(S.cfg.feePct ?? 8) || 0;
const dayFees = (row, sales) => typeof row?.Fees === 'number' ? row.Fees : sales * feePct() / 100;
const boxesOf = b => S.cfg.products.reduce((a, p) => a + num(b[p.field]), 0);
const boxCostCalc = b => S.cfg.products.reduce((a, p) => a + num(b[p.field]) * (+p.cost || 0), 0);
// Box Cost is saved with the row when logged, so later price changes don't rewrite old days
const boxCost = b => typeof b['Box Cost'] === 'number' ? b['Box Cost'] : boxCostCalc(b);
const rowCost = b => boxCost(b) + breakExtraCols().reduce((a, c) => a + num(b[c]), 0);
function breakers(){ const s = new Set(S.cfg.breakers); S.breaks.forEach(b => b.Breaker && s.add(b.Breaker)); return [...s]; }
const colorOf = name => COLORS[breakers().indexOf(name) % COLORS.length] || 'var(--muted)';

/* ---------- Build each day: TikTok sales + your breaker rows ---------- */
function buildDays(){
  const map = {}, dCols = dayCostCols();
  const get = k => (map[k] ||= { date: k, row: null, rows: [] });
  S.days.forEach(d => d.Date && (get(d.Date).row = d));
  S.breaks.forEach(b => b.Date && get(b.Date).rows.push(b));
  return Object.values(map).map(x => {
    const rs = x.rows;
    const sales = typeof x.row?.Sales === 'number' ? x.row.Sales : rs.reduce((a, b) => a + num(b.Sales), 0);
    const fees = dayFees(x.row, sales);
    const dayCost = dCols.reduce((a, c) => a + num(x.row?.[c]), 0) + fees;
    const costs = dayCost + rs.reduce((a, b) => a + rowCost(b), 0);
    const profit = typeof x.row?.Profit === 'number' ? x.row.Profit : sales - costs;
    const byProd = {}; S.cfg.products.forEach(p => byProd[p.name] = rs.reduce((a, b) => a + num(b[p.field]), 0));
    const boxes = Object.values(byProd).reduce((a, n) => a + n, 0), helmets = boxes;
    // Split the day's sales across breakers: own Sales if typed, the rest by helmets opened
    const priced = rs.filter(b => typeof b.Sales === 'number'), open = rs.filter(b => typeof b.Sales !== 'number');
    const left = Math.max(0, sales - priced.reduce((a, b) => a + b.Sales, 0));
    const weight = b => boxesOf(b);
    const pool = open.length ? open : rs, W = pool.reduce((a, b) => a + weight(b), 0);
    const alloc = rs.map(b => {
      const share = pool.includes(b) ? (W ? left * weight(b) / W : left / pool.length) : 0;
      const s = (typeof b.Sales === 'number' ? b.Sales : 0) + share;
      return { b, sales: s, costs: rowCost(b) + (sales ? dayCost * s / sales : dayCost / rs.length), helmets: boxesOf(b), boxes: boxesOf(b) };
    });
    return { date: x.date, row: x.row, rows: rs, alloc, sales, costs, profit, helmets, boxes, byProd, orders: num(x.row?.Orders), hasCosts: rs.length > 0 || typeof x.row?.Profit === 'number', fees, shipping: num(x.row?.Shipping) };
  }).sort((a, b) => a.date.localeCompare(b.date));
}
function bounds(){
  const t = todayK(), ws = weekStart(t);
  const lm = (() => { const d = new Date(t.slice(0, 8) + '01T12:00:00'); d.setDate(0); const e = ymd(d); return [e.slice(0, 8) + '01', e]; })();
  return { yesterday: [shift(t, -1), shift(t, -1)], week: [ws, shift(ws, 6)], lastweek: [shift(ws, -7), shift(ws, -1)], '30d': [shift(t, -29), t], month: [t.slice(0, 8) + '01', t], lastmonth: lm, year: [t.slice(0, 4) + '-01-01', t], all: ['0000', '9999'], custom: [S.from || '0000', S.to || '9999'] }[S.range];
}
const inRange = list => { const [a, b] = bounds(); return list.filter(d => d.date >= a && d.date <= b); };
function sum(days){
  const t = { sales: 0, costs: 0, profit: 0, helmets: 0, boxes: 0, orders: 0, byProd: {} };
  S.cfg.products.forEach(p => t.byProd[p.name] = 0);
  days.forEach(d => { t.sales += d.sales; t.costs += d.costs; t.profit += d.profit; t.helmets += d.helmets; t.boxes += d.boxes; t.orders += d.orders; Object.entries(d.byProd).forEach(([k, n]) => t.byProd[k] = (t.byProd[k] || 0) + n); });
  return t;
}
const prodSplit = bp => S.cfg.products.map(p => `${fmtN(bp[p.name] || 0)} ${esc(p.name)}`).join(', ');

/* ---------- Chart ---------- */
function barChart(points, fmt){
  const W = 820, H = 230, L = 56, R = 10, T = 12, B = 30;
  if (!points.length) return '';
  let max = Math.max(0, ...points.map(p => p.v)), min = Math.min(0, ...points.map(p => p.v)); if (max === min) max = 1;
  const y = v => T + (max - v) / (max - min) * (H - T - B), bw = (W - L - R) / points.length, gap = Math.min(6, bw * .25);
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = min + (max - min) / 4 * i; g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v === 0 ? 1.4 : .6}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${esc(fmt(v, true))}</text>`; }
  const every = Math.ceil(points.length / 12);
  points.forEach((p, i) => {
    const x = L + i * bw + gap / 2;
    g += `<rect x="${x}" y="${Math.min(y(p.v), y(0))}" width="${Math.max(1, bw - gap)}" height="${Math.abs(y(p.v) - y(0))}" rx="2" fill="${p.v < 0 ? 'var(--loss)' : p.dim ? 'var(--muted)' : 'var(--gold)'}"><title>${esc(p.title)}: ${esc(fmt(p.v))}${p.dim ? ' (costs not entered)' : ''}</title></rect>`;
    if (i % every === 0) g += `<text x="${x + (bw - gap) / 2}" y="${H - 10}" text-anchor="middle">${esc(p.label)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart">${g}</svg>`;
}

/* ---------- Range bar ---------- */
const RANGES = [['yesterday','Yesterday'],['week','This week'],['lastweek','Last week'],['30d','30 days'],['month','This month'],['lastmonth','Last month'],['year','This year'],['all','All time'],['custom','Custom']];
function rangeBar(extra = ''){
  return `<div class="bar"><div class="chips">${RANGES.map(([k, l]) => `<button data-range="${k}" class="${S.range === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${S.range === 'custom' ? `<input type="date" id="rFrom" value="${S.from}" aria-label="From"><input type="date" id="rTo" value="${S.to}" aria-label="To">` : ''}
    <span style="flex:1"></span>${extra}</div>`;
}
function bindRange(v){
  $$('[data-range]', v).forEach(b => b.onclick = () => { S.range = b.dataset.range; render(); });
  $('#rFrom', v)?.addEventListener('change', e => { S.from = e.target.value; render(); });
  $('#rTo', v)?.addEventListener('change', e => { S.to = e.target.value; render(); });
}

/* ---------- Dashboard ---------- */
function renderDays(){
  const v = $('#view'), days = inRange(buildDays()), t = sum(days), [a, b] = bounds();
  const lo = a === '0000' ? days[0]?.date : a, hi = b === '9999' ? days[days.length - 1]?.date : (b > todayK() ? todayK() : b);
  const span = lo && hi ? daysBetween(lo, hi) : 0, perWeek = span > 7 ? t.boxes / (span / 7) : null;
  const missing = days.filter(d => d.sales && !d.hasCosts).length;
  const metrics = { profit: ['Profit', d => d.profit], sales: ['Sales', d => d.sales], boxes: ['Helmets', d => d.boxes] };

  const per = {};
  days.forEach(d => d.alloc.forEach(x => { const k = x.b.Breaker || 'Unassigned'; const p = (per[k] ||= { boxes: 0, helmets: 0, sales: 0, costs: 0, byProd: {} });
    p.boxes += x.boxes; p.helmets += x.helmets; p.sales += x.sales; p.costs += x.costs; S.cfg.products.forEach(pr => p.byProd[pr.name] = (p.byProd[pr.name] || 0) + num(x.b[pr.field])); }));
  const noLog = days.filter(d => !d.rows.length && d.sales);
  if (noLog.length){ const p = (per['Not logged yet'] ||= { boxes: 0, helmets: 0, sales: 0, costs: 0, byProd: {} }); noLog.forEach(d => { p.sales += d.sales; p.costs += d.costs; }); }
  const perList = Object.entries(per).sort((x, y) => y[1].boxes - x[1].boxes || y[1].sales - x[1].sales);

  const G = S.group, pkey = d => G === 'day' ? d.date : G === 'week' ? weekStart(d.date) : d.date.slice(0, 7);
  const grp = {}; days.forEach(d => (grp[pkey(d)] ||= []).push(d));
  const periods = Object.entries(grp).sort((x, y) => x[0].localeCompare(y[0])).map(([k, ds]) => ({ k, ...sum(ds), missing: ds.filter(d => d.sales && !d.hasCosts).length }));
  const monthName = (k, long) => new Date(k + '-01T12:00:00').toLocaleDateString(undefined, long ? { month: 'long', year: 'numeric' } : { month: 'short', year: '2-digit' });
  const pLabel = k => G === 'day' ? dayLabel(k, true) : G === 'week' ? `Week of ${dayLabel(k)}` : monthName(k, true);
  const pShort = k => G === 'month' ? monthName(k) : dayLabel(k);
  const pName = { day: 'Day', week: 'Week', month: 'Month' }[G];

  v.innerHTML = `
    ${rangeBar(`${S.baseId ? `<a class="btn" href="https://airtable.com/${esc(S.baseId)}" target="_blank" rel="noopener" style="text-decoration:none">Open Airtable</a>` : ''}${S.tiktok?.connected ? `<button class="btn gold" id="pullY">Pull yesterday</button>` : ''}`)}
    <p class="hint">${!lo ? '' : lo === hi ? esc(dayLabel(lo, true)) : `${esc(dayLabel(lo, true))} to ${esc(dayLabel(hi, true))}`}</p>
    <div class="board four">
      <div><div class="lbl">Sales</div><div class="num">${money(t.sales, true)}</div><div class="foot">${t.orders} orders</div></div>
      <div class="net"><div class="lbl">Profit</div><div class="num ${t.profit < 0 ? 'neg' : ''}">${money(t.profit, true)}</div><div class="foot">${pct(t.sales ? t.profit / t.sales : 0)} margin</div></div>
      <div><div class="lbl">Costs</div><div class="num">${money(t.costs, true)}</div><div class="foot">boxes, shipping, fees</div></div>
      <div><div class="lbl">Helmets opened</div><div class="num">${fmtN(t.boxes)}</div><div class="foot">${prodSplit(t.byProd)}${perWeek !== null ? `<br>${fmtN(perWeek)} per week` : ''}</div></div>
    </div>
    <div class="stats">
      <div><div class="k">Sales per helmet</div><div class="v">${money(t.boxes ? t.sales / t.boxes : 0)}</div></div>
      <div><div class="k">Cost per helmet</div><div class="v">${money(t.boxes ? t.costs / t.boxes : 0)}</div></div>
      <div><div class="k">Profit per helmet</div><div class="v ${t.profit < 0 ? 'neg' : 'pos'}">${money(t.boxes ? t.profit / t.boxes : 0)}</div></div>
      <div><div class="k">Helmets per stream day</div><div class="v">${fmtN(days.filter(d => d.boxes).length ? t.boxes / days.filter(d => d.boxes).length : 0)}</div></div>
    </div>
    ${missing ? `<div class="banner">${missing} day${missing > 1 ? 's have' : ' has'} sales but nothing logged yet. Add them on the Log a day tab.</div>` : ''}

    <section><h2>By breaker</h2><p class="hint">Each day's sales are split by helmets opened.</p>
      ${perList.length ? `<div class="scroll"><table><thead><tr><th>Breaker</th>${S.cfg.products.map(p => `<th>${esc(p.name)}</th>`).join('')}<th>Total</th><th>Sales</th><th>Profit</th><th>Per helmet</th></tr></thead><tbody>
      ${perList.map(([k, p]) => `<tr><td><span class="who" style="background:${colorOf(k)}"></span>${esc(k)}</td>${S.cfg.products.map(pr => `<td>${p.byProd[pr.name] ? fmtN(p.byProd[pr.name]) : ''}</td>`).join('')}<td>${p.boxes ? fmtN(p.boxes) : ''}</td><td>${money(p.sales)}</td><td class="${p.sales - p.costs < 0 ? 'neg' : 'pos'}">${money(p.sales - p.costs)}</td><td>${p.boxes ? money((p.sales - p.costs) / p.boxes) : ''}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty">Nothing logged in this range.</div>`}</section>

    <section><div class="head"><div><h2>By ${pName.toLowerCase()}</h2><p class="hint">${G === 'week' ? 'Monday to Sunday. ' : ''}Grey bars still have days with nothing logged.</p></div>
      <div class="bar" style="margin:0"><div class="chips" aria-label="Group by">${[['day','Day'],['week','Week'],['month','Month']].map(([k, n]) => `<button data-group="${k}" class="${G === k ? 'on' : ''}">${n}</button>`).join('')}</div>
      <div class="chips" aria-label="Chart">${Object.entries(metrics).map(([k, [n]]) => `<button data-metric="${k}" class="${S.metric === k ? 'on' : ''}">${n}</button>`).join('')}</div></div></div>
      ${periods.length ? barChart(periods.map(p => ({ label: pShort(p.k), title: pLabel(p.k), v: metrics[S.metric][1](p), dim: S.metric === 'profit' && p.missing > 0 })), S.metric === 'boxes' ? n => fmtN(n) : (n, s) => money(n, s)) : ''}
      ${periods.length ? `<div class="scroll" style="margin-top:12px"><table><thead><tr><th>${pName}</th><th>Sales</th>${S.cfg.products.map(p => `<th>${esc(p.name)}</th>`).join('')}<th>Helmets</th><th>Costs</th><th>Profit</th><th>Margin</th><th>Per helmet</th></tr></thead><tbody>
      ${periods.slice().reverse().map(p => `<tr><td>${esc(pLabel(p.k))}${p.missing ? `<span class="tag">${G === 'day' ? 'not logged' : `${p.missing} day${p.missing > 1 ? 's' : ''} not logged`}</span>` : ''}</td><td>${money(p.sales)}</td>${S.cfg.products.map(pr => `<td>${p.byProd[pr.name] ? fmtN(p.byProd[pr.name]) : ''}</td>`).join('')}<td>${p.boxes ? fmtN(p.boxes) : ''}</td><td>${money(p.costs)}</td><td class="${p.profit < 0 ? 'neg' : 'pos'}">${money(p.profit)}</td><td>${pct(p.sales ? p.profit / p.sales : 0)}</td><td>${p.boxes ? money(p.profit / p.boxes) : ''}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty">No days in this range yet.</div>`}
    </section>`;
  bindRange(v);
  $$('[data-metric]', v).forEach(b => b.onclick = () => { S.metric = b.dataset.metric; renderDays(); });
  $$('[data-group]', v).forEach(b => b.onclick = () => { S.group = b.dataset.group; localStorage.setItem('pl_group', S.group); renderDays(); });
  $('#pullY', v)?.addEventListener('click', e => pull(null, null, e.target));
}

/* ---------- Log a day: every breaker at once ---------- */
function renderLog(){
  const v = $('#view'), date = S.entryDate || shift(todayK(), -1);
  const existing = S.breaks.filter(b => b.Date === date);
  const names = [...new Set([...S.cfg.breakers, ...existing.map(b => b.Breaker).filter(Boolean)])];
  const extras = breakExtraCols();
  const dayRow = S.days.find(d => d.Date === date);
  const val = (b, k) => typeof b?.[k] === 'number' ? b[k] : '';
  const cell = (k, b, step = '1', ph = '0') => `<td><input type="number" min="0" step="${step}" data-f="${esc(k)}" value="${val(b, k)}" placeholder="${ph}" aria-label="${esc(k)}"></td>`;

  // Recent days for quick edit
  const recent = buildDays().filter(d => d.rows.length || d.shipping || typeof d.row?.Fees === 'number').slice(-14).reverse();

  v.innerHTML = `
    <section style="margin-top:14px"><div class="head"><div><h2>Log a day</h2><p class="hint">Enter the day's shipping, then how many of each helmet each breaker opened. Box cost is worked out from your prices: ${S.cfg.products.map(p => `${esc(p.name)} ${money(p.cost, true)}`).join(', ')}.</p></div>
      <label class="row" style="color:var(--muted);font-size:13px">Day <input type="date" id="eDate" value="${date}"></label></div>
      <p class="hint">${existing.length ? `Already logged for ${esc(dayLabel(date, true))}. Changes overwrite it.` : `Nothing logged for ${esc(dayLabel(date, true))} yet.`} TikTok sales that day: <b style="color:var(--text)">${typeof dayRow?.Sales === 'number' ? money(dayRow.Sales) : 'not pulled yet'}</b></p>
      <div class="row" style="margin-bottom:12px">
        <label>Shipping for the day<input type="number" min="0" step="0.01" id="dShip" value="${typeof dayRow?.Shipping === 'number' ? dayRow.Shipping : ''}" placeholder="0.00"></label>
        <label>Fees for the day<input type="number" min="0" step="0.01" id="dFees" value="${typeof dayRow?.Fees === 'number' ? dayRow.Fees : ''}" placeholder="${typeof dayRow?.Sales === 'number' ? money(dayRow.Sales * feePct() / 100) + ' auto' : 'auto'}"></label>
        <span class="hint" style="margin:0 0 8px">Leave fees blank to use ${feePct()}% of the day's sales.</span>
      </div>
      <div class="scroll"><table class="entry" id="eTable"><thead><tr><th>Breaker</th>${S.cfg.products.map(p => `<th>${esc(p.name)}</th>`).join('')}<th>Helmets opened</th>${extras.map(c => `<th>${esc(c)}</th>`).join('')}<th>Box cost</th></tr></thead><tbody>
      ${names.map(n => { const b = existing.find(x => x.Breaker === n); return `<tr data-breaker="${esc(n)}" data-id="${esc(b?.id || '')}"><td><span class="who" style="background:${colorOf(n)}"></span>${esc(n)}</td>
        ${S.cfg.products.map(p => cell(p.field, b)).join('')}<td class="hc">${b ? fmtN(boxesOf(b)) : 0}</td>${extras.map(c => cell(c, b, '0.01', '0.00')).join('')}<td class="bc">${b ? money(boxCost(b)) : money(0)}</td></tr>`; }).join('')}
      </tbody><tfoot><tr><td><b>Total</b></td>${S.cfg.products.map(p => `<td data-tot="${esc(p.field)}"></td>`).join('')}<td data-tot="hc"></td>${extras.map(c => `<td data-tot="${esc(c)}"></td>`).join('')}<td data-tot="bc"></td></tr></tfoot></table></div>
      <div class="bar" style="margin-bottom:0"><button class="btn gold" id="eSave">Save day</button><button class="btn" id="eAdd">Add a breaker</button><span style="flex:1"></span>${existing.length ? '<button class="btn danger" id="eClear">Clear this day</button>' : ''}</div>
    </section>
    <section><h2>Recently logged</h2><p class="hint">Click a day to open it above.</p>
      ${recent.length ? `<div class="scroll"><table><thead><tr><th>Day</th>${breakers().map(n => `<th>${esc(n)}</th>`).join('')}${S.cfg.products.map(p => `<th>${esc(p.name)}</th>`).join('')}<th>Helmets</th><th>Shipping</th><th>Fees</th><th>Costs</th></tr></thead><tbody>
      ${recent.map(d => `<tr data-day="${d.date}" style="cursor:pointer"><td>${esc(dayLabel(d.date, true))}</td>${breakers().map(n => { const r = d.rows.find(x => x.Breaker === n); return `<td>${r ? `${fmtN(boxesOf(r))}` : ''}</td>`; }).join('')}${S.cfg.products.map(p => `<td>${d.byProd[p.name] ? fmtN(d.byProd[p.name]) : ''}</td>`).join('')}<td>${d.boxes ? fmtN(d.boxes) : ''}</td><td>${money(d.shipping)}</td><td>${money(d.fees)}</td><td>${money(d.costs)}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty">Nothing logged yet.</div>`}
    </section>`;

  const table = $('#eTable');
  const rowData = tr => { const f = {}; $$('[data-f]', tr).forEach(i => f[i.dataset.f] = i.value === '' ? null : Number(i.value)); return f; };
  const totals = () => {
    let bcAll = 0; const tot = {};
    $$('tbody tr', table).forEach(tr => { const f = rowData(tr); Object.entries(f).forEach(([k, x]) => tot[k] = (tot[k] || 0) + (x || 0)); const bc = boxCostCalc(f); bcAll += bc; $('.bc', tr).textContent = money(bc); $('.hc', tr).textContent = fmtN(boxesOf(f)); });
    $$('[data-tot]', table).forEach(td => { const k = td.dataset.tot; td.textContent = k === 'bc' ? money(bcAll) : k === 'hc' ? fmtN(prodFields().reduce((a, f) => a + (tot[f] || 0), 0)) : (prodFields().includes(k) ? fmtN(tot[k] || 0) : money(tot[k] || 0)); });
  };
  totals();
  table.addEventListener('input', totals);
  $('#eDate').onchange = e => { S.entryDate = e.target.value; renderLog(); };
  $$('tr[data-day]', v).forEach(tr => tr.onclick = () => { S.entryDate = tr.dataset.day; renderLog(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  $('#eAdd').onclick = () => { const n = prompt('Breaker name:'); if (!n) return; S.cfg.breakers = [...new Set([...S.cfg.breakers, n.trim()])]; saveConfig(); renderLog(); };
  $('#eClear')?.addEventListener('click', () => { if (!confirm(`Delete everything logged for ${dayLabel(date, true)}?`)) return; guarded(async () => {
    for (const b of existing){ await req('breaks', { method: 'DELETE', body: JSON.stringify({ id: b.id }) }); }
    S.breaks = S.breaks.filter(b => b.Date !== date); toast('Day cleared'); renderLog();
  }); });
  $('#eSave').onclick = e => guarded(async () => {
    const day = $('#eDate').value; if (!day) return toast('Pick a day', true);
    e.target.disabled = true; e.target.textContent = 'Saving…';
    let saved = 0;
    try {
      for (const tr of $$('tbody tr', table)){
        const f = rowData(tr), id = tr.dataset.id, empty = Object.values(f).every(x => !x);
        if (empty && !id) continue;
        if (empty && id){ await req('breaks', { method: 'DELETE', body: JSON.stringify({ id }) }); S.breaks = S.breaks.filter(b => b.id !== id); continue; }
        const fields = { ...f, Date: day, Breaker: tr.dataset.breaker, 'Box Cost': boxCostCalc(f) };
        if (id){ const { record } = await req('breaks', { method: 'PATCH', body: JSON.stringify({ id, fields }) }); S.breaks = S.breaks.map(b => b.id === id ? record : b); }
        else { const { record } = await req('breaks', { method: 'POST', body: JSON.stringify({ fields }) }); S.breaks.push(record); }
        saved++;
      }
      const ship = $('#dShip').value, fees = $('#dFees').value, dr = S.days.find(d => d.Date === day);
      if (ship !== '' || fees !== '' || typeof dr?.Shipping === 'number' || typeof dr?.Fees === 'number'){
        await req('days', { method: 'POST', body: JSON.stringify({ date: day, fields: { Shipping: ship === '' ? null : Number(ship), Fees: fees === '' ? null : Number(fees) } }) });
        saved++;
        const dd = S.days.find(d => d.Date === day) || (S.days.push({ Date: day }), S.days[S.days.length - 1]);
        if (ship === '') delete dd.Shipping; else dd.Shipping = Number(ship);
        if (fees === '') delete dd.Fees; else dd.Fees = Number(fees);
      }
      toast(saved ? `Saved ${dayLabel(day, true)}` : 'Nothing to save');
    } finally { e.target.disabled = false; e.target.textContent = 'Save day'; }
    renderLog();
  });
}

/* ---------- Setup ---------- */
async function saveConfig(){ await guarded(() => req('config', { method: 'PUT', body: JSON.stringify(S.cfg) })); }
function renderSetup(){
  const v = $('#view'), tt = S.tiktok || {}, y = shift(todayK(), -1);
  const allNum = [...new Set([...numCols(S.days, DAY_NON_COST), ...breakExtraCols(), ...numCols(S.breaks, breakNonCost())])];
  v.innerHTML = `
    <section><h2>Box prices</h2><p class="hint">What one box costs you. New prices apply to days you log from now on; days already saved keep the price they were logged with.</p>
      <div class="list">${S.cfg.products.map((p, i) => `<div class="row"><label>Product<input type="text" data-p="${i}" data-k="name" value="${esc(p.name)}"></label><label>Cost per box<input type="number" step="0.01" data-p="${i}" data-k="cost" value="${esc(p.cost)}"></label><label>Airtable column<input type="text" value="${esc(p.field)}" disabled></label>${S.cfg.products.length > 1 ? `<button class="btn danger" data-rmp="${i}">Remove</button>` : ''}</div>`).join('')}</div>
      <p class="hint" style="margin-top:10px">Adding a product? Add a number column with the same name plus “Boxes” to the Breaks table in Airtable first.</p>
      <button class="btn" id="addProd">Add product</button>
    </section>
    <section><h2>Fees</h2><p class="hint">Used for any day where you haven't typed fees yourself.</p>
      <div class="row"><label>Default fees, % of sales<input type="number" step="0.1" id="feePct" value="${feePct()}"></label></div>
    </section>
    <section><h2>Breakers</h2><p class="hint">Each one gets a row on the Log a day tab.</p>
      <div class="row">${S.cfg.breakers.map((n, i) => `<span class="tag" style="font-size:14px;padding:4px 10px">${esc(n)} <button class="mini" data-rmb="${i}" aria-label="Remove ${esc(n)}">×</button></span>`).join('')}<button class="btn" id="addBr">Add breaker</button></div>
    </section>
    <section><h2>TikTok Shop</h2>
      ${tt.connected ? `<p class="hint">Connected to <b style="color:var(--text)">${esc(tt.shopName || 'your shop')}</b>. Yesterday's sales pull in on their own every morning.${tt.lastSync ? ` Last pull ${esc(new Date(tt.lastSync).toLocaleString())}.` : ''}</p>
        <div class="row"><label>From<input type="date" id="pFrom" value="${y}"></label><label>To<input type="date" id="pTo" value="${y}"></label><button class="btn gold" id="pullR">Pull these days</button><button class="btn danger" id="ttOff">Disconnect</button></div>` :
        `<p class="hint">${tt.error ? esc(tt.error) : 'Connect once and each day’s sales total lands in Airtable automatically.'}</p><button class="btn gold" id="ttOn">Connect TikTok Shop</button>`}
      ${tt.scopes?.length ? `<p class="hint" style="margin-top:10px">Permissions on this login: ${tt.scopes.map(s => `<span class="tag">${esc(s)}</span>`).join(' ')}</p>` : ''}
    </section>
    <section><h2>Set a day's sales by hand</h2><p class="hint">For days TikTok didn’t pull. Overwrites that day’s sales number.</p>
      <div class="row"><label>Day<input type="date" id="mDate" value="${y}"></label><label>Sales<input type="number" step="0.01" id="mSales" placeholder="0.00"></label><button class="btn gold" id="mSave">Save sales</button></div>
    </section>
    <section><h2>What counts as a cost</h2><p class="hint">Box cost, shipping and fees always count. Any other number column you add in Airtable is subtracted too, except helmets, box counts and orders. Untick any that aren’t costs.</p>
      <div style="display:flex;flex-wrap:wrap">${allNum.map(c => `<label class="check"><input type="checkbox" data-col="${esc(c)}" ${S.notCost.includes(c) ? '' : 'checked'}>${esc(c)}</label>`).join('')}</div>
    </section>
    <section><h2>Access</h2><button class="btn" id="key">Change admin key</button></section>`;

  $$('[data-p]', v).forEach(i => i.onchange = () => { const p = S.cfg.products[+i.dataset.p]; if (i.dataset.k === 'cost') p.cost = Number(i.value) || 0; else p.name = i.value.trim() || p.name; saveConfig(); toast('Saved'); });
  $$('[data-rmp]', v).forEach(b => b.onclick = () => { if (!confirm('Remove this product? Its Airtable column stays.')) return; S.cfg.products.splice(+b.dataset.rmp, 1); saveConfig(); renderSetup(); });
  $('#feePct').onchange = e => { S.cfg.feePct = Number(e.target.value) || 0; saveConfig(); toast(`Fees set to ${S.cfg.feePct}%`); };
  $('#addProd').onclick = () => { const n = prompt('Product name (e.g. Riddell Minis):'); if (!n) return; const c = Number(prompt('Cost per box:', '0')) || 0; S.cfg.products.push({ name: n.trim(), field: `${n.trim()} Boxes`, cost: c }); saveConfig(); renderSetup(); toast(`Add a number column called “${n.trim()} Boxes” in Airtable`); };
  $$('[data-rmb]', v).forEach(b => b.onclick = () => { S.cfg.breakers.splice(+b.dataset.rmb, 1); saveConfig(); renderSetup(); });
  $('#addBr').onclick = () => { const n = prompt('Breaker name:'); if (!n) return; S.cfg.breakers = [...new Set([...S.cfg.breakers, n.trim()])]; saveConfig(); renderSetup(); };
  $('#ttOn')?.addEventListener('click', () => guarded(async () => { location.href = (await req('tiktok-auth?action=start')).url; }));
  $('#ttOff')?.addEventListener('click', () => { if (confirm('Disconnect TikTok? Your data stays in Airtable.')) guarded(async () => { await req('tiktok-auth?action=disconnect', { method: 'POST' }); S.tiktok = { connected: false }; renderSetup(); }); });
  $('#pullR')?.addEventListener('click', e => pull($('#pFrom').value, $('#pTo').value, e.target));
  $('#mSave').onclick = () => guarded(async () => {
    const date = $('#mDate').value, sales = $('#mSales').value;
    if (!date || sales === '') return toast('Pick a day and type the sales', true);
    await req('days', { method: 'POST', body: JSON.stringify({ date, sales: Number(sales) }) });
    toast(`Saved ${money(+sales)} for ${dayLabel(date, true)}`); $('#mSales').value = ''; await loadAll();
  });
  $$('[data-col]').forEach(c => c.onchange = () => {
    S.notCost = c.checked ? S.notCost.filter(x => x !== c.dataset.col) : [...S.notCost, c.dataset.col];
    localStorage.setItem('pl_not_cost', JSON.stringify(S.notCost));
  });
  $('#key').onclick = () => { const k = prompt('New admin key:'); if (k){ localStorage.setItem(KEYK, k.trim()); toast('Admin key updated'); } };
}

async function pull(from, to, btn){
  if (btn){ btn.disabled = true; btn.textContent = 'Pulling…'; }
  await guarded(async () => {
    const r = await req('tiktok-sync', { method: 'POST', body: JSON.stringify(from ? { from, to } : {}) });
    toast(r.days.length ? `Pulled ${r.days.map(d => `${dayLabel(d.Date)} ${money(d.Sales)}`).join(', ')}` : 'No sales found for those days');
    S.tiktok.lastSync = new Date().toISOString(); await loadAll();
  });
  if (btn){ btn.disabled = false; btn.textContent = from ? 'Pull these days' : 'Pull yesterday'; }
}
async function loadAll(){
  const [d, b, c] = await Promise.all([req('days'), req('breaks'), req('config').catch(() => ({}))]);
  S.days = d.days; S.baseId = d.baseId; S.breaks = b.breaks;
  if (c.config) S.cfg = { ...JSON.parse(JSON.stringify(DEFAULT_CONFIG)), ...c.config };
  render();
}
function render(){ ({ days: renderDays, log: renderLog, setup: renderSetup })[S.tab](); }
$$('nav button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; $$('nav button').forEach(x => x.setAttribute('aria-selected', x === b)); render(); });

(async () => {
  const u = new URLSearchParams(location.search);
  if (u.get('tiktok') === 'connected') toast('TikTok Shop connected');
  if (u.get('tiktok') === 'error') toast(u.get('msg') || 'TikTok connection failed', true);
  if (u.has('tiktok')) history.replaceState(null, '', location.pathname);
  render();
  await guarded(loadAll);
  try { S.tiktok = await req('tiktok-auth?action=status'); } catch (e){ S.tiktok = { connected: false, error: e.message }; }
  render();
})();
</script>
</body>
</html>
